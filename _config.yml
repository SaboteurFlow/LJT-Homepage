locale                   : "en-US"
title                    : "Junteng Liu"
title_separator          : "-"
name                     : "Junteng Liu"
description              : "Junteng Liu's academic homepage"
url                      : https://saboteurflow.github.io
baseurl                  : "/LJT-Homepage"
repository               : "SaboteurFlow/LJT-Homepage"

author:
  avatar           : "profile.png"
  name             : "Junteng Liu"
  bio              : "First-year Ph.D. candidate in Computer Science at the Hong Kong University of Science and Technology (HKUST), advised by Professor Junxian He. His research focuses on natural language processing and machine learning, with interests in LLM reasoning and reinforcement learning, hallucination in vision-language models, and LLM truthfulness and interpretability."
  location         : "Hong Kong"
  employer         : "Hong Kong University of Science and Technology"
  email            : "jliugi@connect.ust.hk"
  arxiv            :
  googlescholar    : "https://scholar.google.com/citations?hl=en&user=tbK9jl4AAAAJ&view_op=list_works&sortby=pubdate"
  github           : "Vicent0205"
  twitter          : "junteng88716710"

publication_category:
  books:
    title: 'Books'
  preprints:
    title: 'Preprints'
  conferences:
    title: 'Conference Papers'

teaser                   :
breadcrumbs              : false
words_per_minute         : 160
future                   : true
read_more                : "disabled"
talkmap_link             : false
comments:
  provider               : false

include:
  - .htaccess
  - _pages
  - files

exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - CHANGELOG.md
  - Dockerfile
  - docker-compose.yaml
  - talkmap.ipynb
  - talkmap.py
  - talkmap_out.ipynb
  - markdown_generator
  - scripts
  - .devcontainer
  - .github

markdown: kramdown
highlighter: rouge

collections:
  teaching:
    output: true
    permalink: /:collection/:path/
  publications:
    output: true
    permalink: /:collection/:path/
  portfolio:
    output: true
    permalink: /:collection/:path/
  talks:
    output: true
    permalink: /:collection/:path/

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: true
      comments: true

sass:
  sass_dir: _sass
  style: compressed

plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji
